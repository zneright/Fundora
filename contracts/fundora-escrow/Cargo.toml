[package]
name = "fundora-escrow"
version = "1.0.0"
edition = "2021"
authors = ["Fundora Civic Engineering"]
description = "Fundora — Multi-Barangay Programmable Milestone Escrow, Quorum Governance & AI Attestation Smart Contract on NEAR Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.6.0", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["legacy", "unit-testing"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
